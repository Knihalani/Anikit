<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anikit — real-time 3D journey</title>
<style>
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; image-rendering: auto; }
  #hud { position: fixed; left: 16px; bottom: 14px; font: 12px/1.4 ui-monospace, monospace; color: #b9c2ff; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module">
  // A real-time fly-through rendered by anikit's WebAssembly rasterizer (no WebGL):
  // per-pixel chrome, glowing grid lines, travelling pulses, a mirror floor and
  // streaking stars, on a looping flightPath. Resolution adapts to hold the frame rate.
  import { ready, renderer3d, scene3d, mesh, instances, flightPath, engine } from '../packages/anikit/dist/anikit.js';
  await ready;
  const canvas = document.getElementById('c'), hud = document.getElementById('hud');
  let scale = 0.5;
  const size = () => [Math.max(160, Math.round(innerWidth * scale)), Math.max(90, Math.round(innerHeight * scale))];
  let [W, H] = size();
  canvas.width = W; canvas.height = H;
  const r3 = renderer3d(canvas);
  const cam = scene3d({ fov: 64, width: W, height: H, near: 4, far: 30000 });
  let seed = 3;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  // A ring road of towers around a loop.
  const R = 9000, towers = instances(520, (i) => {
    const a = (i / 260) * Math.PI * 2, side = i % 2 ? 1 : -1, off = side * (380 + rnd() * 900), h = 200 + rnd() * 1700;
    return { x: Math.cos(a) * (R + off), y: -300 + h / 2, z: Math.sin(a) * (R + off), ry: (-a * 180) / Math.PI, sx: 110, sy: h, sz: 110, color: [0.03, 0.035, 0.05] };
  });
  const gates = instances(12, (i) => { const a = (i / 12) * Math.PI * 2 + 0.2; return { x: Math.cos(a) * R, y: 160, z: Math.sin(a) * R, ry: (-a * 180) / Math.PI, color: [0.9, 0.92, 1] }; });
  const stars = new Float32Array(15000 * 3);
  for (let i = 0; i < 15000; i++) { const a = rnd() * Math.PI * 2, r = R + (rnd() - 0.5) * 5000; stars.set([Math.cos(a) * r, -200 + rnd() * 3500, Math.sin(a) * r], i * 3); }
  const pts = Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * Math.PI * 2; return [Math.cos(a) * R, 120 + 90 * Math.sin(a * 3), Math.sin(a) * R]; });
  const path = flightPath(pts, { closed: true, lookAhead: 900, bank: 1.6 });
  const cube = mesh.cube(), floor = mesh.plane(1), ring = mesh.torus(300, 22, 64, 14);
  const floorInst = instances(1, () => ({ y: -300, sx: 30000, sz: 30000, color: [0.02, 0.02, 0.03] }));
  let s = 0, last = performance.now(), avg = 16;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    s += dt * 2600;
    const t = now / 1000;
    const pose = path.apply(cam, s, Math.sin(t * 0.4) > 0.97 ? (t * 400) % 360 : 0);
    const t0 = performance.now();
    r3.render(cam, [
      { mirror: true, mesh: floor, instances: floorInst, material: { lines: 1.4, lineColor: [0.3, 0.55, 1.6], grid: [180, 180], lineWidth: 0.03, specular: 0.2 } },
      { mesh: cube, instances: towers, material: { metal: 0.6, specular: 1, shininess: 80, lines: 1.8, lineColor: [1.6, 0.3, 1.0], grid: [1, 1], lineWidth: 0.03, pulse: 2, pulsePhase: t * 1.5, pulseDir: [0.0003, 0, 0.0003] } },
      { mesh: ring, instances: gates, material: { metal: 1, iridescence: 0.7, specular: 1.5, shininess: 150, pulse: 3, lineColor: [0.4, 0.9, 1.8], pulseCount: 2, pulsePhase: t * 3 } },
      { points: stars, size: 3, intensity: 2.2, streak: 1.4, fog: [6000, 14000] },
    ], { background: '#03040a', fog: [5000, 16000], fogColor: [0.02, 0.025, 0.06], sky: [0.05, 0.06, 0.16], horizon: [0.9, 0.45, 0.95], ground: [0.01, 0.01, 0.02], strips: [1.8, 1.8, 2.2], mirror: { y: -300, strength: 0.5 } });
    const ms = performance.now() - t0;
    avg = avg * 0.9 + ms * 0.1;
    // Adapt resolution to stay near 30 ms of render time per frame.
    const want = Math.min(1, Math.max(0.3, scale * Math.sqrt(26 / Math.max(4, avg))));
    if (Math.abs(want - scale) > 0.06) {
      scale = want; [W, H] = size(); canvas.width = W; canvas.height = H; r3.resize(W, H); cam.width = W; cam.height = H;
    }
    hud.textContent = `${W}×${H} · ${avg.toFixed(1)} ms/frame · ${r3.triangles.toLocaleString()} triangles · WebAssembly rasterizer, no WebGL`;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
</script>
</body>
</html>
