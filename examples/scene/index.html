<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>anikit scene()</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; opacity: .7; pointer-events: none; }
  #env { position: fixed; right: 12px; top: 10px; }
  button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
<canvas id="c"></canvas>
<div id="env"><button data-env="studio">studio</button> <button data-env="sunset">sunset</button> <button data-env="night">night</button></div>
<div id="hud">click an object · drag to orbit · wheel to zoom</div>
<script type="module">
  import { scene, sphere, torus, roundedBox, lathe, tube, capsule, sdfMesh, sdSphere, sdTorus, smoothUnion, plane, animate, spring, timeline } from '../../packages/anikit/dist/anikit.js';

  const env = new URLSearchParams(location.search).get('env') || 'studio';
  const s = scene('#c', { camera: { fov: 40, position: [0, 2.2, 7.5], target: [0, 0.8, 0] }, environment: env, shadows: true, bloom: true });

  s.add(plane(30, 30), { material: { color: env === 'night' ? '#15171d' : '#3a3b40', roughness: 0.85 } });
  const chrome = s.add(sphere(0.7, 64), { material: 'chrome', position: [-2.2, 0.7, 0] });
  const gold = s.add(torus(0.55, 0.2, 96, 32), { material: 'gold', position: [0, 0.9, 0], rotation: [Math.PI / 2.4, 0, 0] });
  const glass = s.add(roundedBox(1.1, 1.1, 1.1, 0.18, 6), { material: 'glass', position: [2.2, 0.55, 0] });
  const vase = s.add(lathe([[0, 0], [0.35, 0.02], [0.45, 0.3], [0.2, 0.9], [0.28, 1.25], [0.25, 1.3]], 64), { material: 'ceramic', position: [-1.1, 0, -1.8] });
  const blob = s.add(sdfMesh((x, y, z) => smoothUnion(sdSphere(x - 0.25, y, z, 0.45), sdTorus(x + 0.2, y - 0.1, z, 0.45, 0.14), 0.25), { resolution: 56, bounds: 1 }),
    { material: { preset: 'toon', color: '#ff7a59' }, position: [1.1, 0.6, -1.8] });
  const knot = s.add(tube((t) => { const a = t * Math.PI * 2; return [Math.sin(a) + 2 * Math.sin(2 * a), Math.cos(a) - 2 * Math.cos(2 * a), -Math.sin(3 * a)].map((v) => v * 0.28); }, 0.07, 256, 16),
    { material: 'copper', position: [0, 1.4, -3.4] });
  const neon = s.add(capsule(0.08, 1.6, 24), { material: { preset: 'emissive', emissive: '#61dafb' }, position: [-3.2, 0.8, -1.5] });

  // 400 instanced pebbles in one draw call
  s.instances(sphere(1, 12), 400, (i, o) => {
    const a = i * 2.39996, r = 3.6 + Math.sqrt(i) * 0.25;
    o.position.set(Math.cos(a) * r, 0.05, Math.sin(a) * r);
    o.scale.set(0.05 + (i % 7) * 0.012);
    o.color[0] = 0.6 + 0.4 * Math.sin(i); o.color[1] = 0.6; o.color[2] = 0.9;
  }, { material: 'plastic' });

  // Animate transforms and materials with anikit
  animate(gold.rotation, { z: Math.PI * 2 }, { duration: 8, ease: 'linear', repeat: -1 });
  animate(knot.rotation, { y: Math.PI * 2 }, { duration: 14, ease: 'linear', repeat: -1 });
  animate(neon.material, { emissiveIntensity: [1, 6] }, { duration: 1.4, yoyo: true, repeat: -1, ease: 'inOutSine' });
  for (const o of [chrome, gold, glass, vase, blob, knot]) {
    o.on('click', () => {
      const y = o.position.y;
      timeline().to(o.position, { y: y + 0.8 }, { duration: 0.35, ease: 'outQuad' }).to(o.position, { y }, { duration: 0.6, ease: 'outBounce' });
    });
    o.on('pointerenter', () => spring(o.scale, { x: 1.12, y: 1.12, z: 1.12 }));
    o.on('pointerleave', () => spring(o.scale, { x: 1, y: 1, z: 1 }));
  }
  s.orbit({ autoRotate: 6 });
  for (const b of document.querySelectorAll('[data-env]')) b.onclick = () => (location.search = '?env=' + b.dataset.env);
  window.s = s;
</script>
