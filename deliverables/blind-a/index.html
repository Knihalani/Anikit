<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>f(t)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #04050a;
        --ink: #f4f1ea;
        --dim: rgba(244, 241, 234, 0.55);
        --accent: #ffb35c;
        --cool: #7fd6ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: var(--ground);
      }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        font-family: Inter, sans-serif; color: var(--ink);
      }
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; z-index: 1; }

      /* HUD */
      .hud {
        position: absolute; z-index: 5; font-family: "JetBrains Mono", monospace;
        font-size: 28px; letter-spacing: 0.04em; color: rgba(244, 241, 234, 0.72);
      }
      #hud-t { left: 192px; bottom: 108px; }
      #hud-f { right: 192px; bottom: 108px; text-align: right; }
      #hud-label { left: 192px; top: 108px; }
      #hud-res { right: 192px; top: 108px; text-align: right; }
      .hud b { color: var(--ink); font-weight: 400; }

      /* Act 1 lines */
      #act1 { position: absolute; z-index: 4; left: 192px; top: 300px; }
      .line {
        display: block; font-weight: 900; font-size: 128px; line-height: 1.02;
        letter-spacing: -0.045em; white-space: nowrap;
      }
      .line span { display: inline-block; }
      .acc { color: var(--accent); }

      /* Act 2 montage */
      .cut {
        position: absolute; z-index: 4; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      .cut span {
        display: inline-block; font-weight: 900; font-size: 300px; letter-spacing: -0.06em;
        color: var(--ink); mix-blend-mode: difference;
      }
      .cut.small span { font-size: 210px; }

      /* Act 3 title */
      #title-wrap {
        position: absolute; z-index: 4; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding-bottom: 60px;
      }
      #title { font-weight: 900; font-size: 360px; letter-spacing: -0.05em; line-height: 1; color: #fff; }
      #title span { display: inline-block; }
      #title .paren { color: var(--accent); font-weight: 400; }
      #sub {
        margin-top: 34px; font-size: 44px; font-weight: 400; letter-spacing: -0.01em; color: var(--ink);
      }
      #sub span { display: inline-block; }
      #sub .em { color: var(--cool); }
      #flash { position: absolute; inset: 0; z-index: 6; background: #fff6ea; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15"
         data-width="1920" data-height="1080" data-fps="30">

      <canvas id="world" width="1920" height="1080" data-layout-ignore></canvas>

      <div id="hud-label" class="hud clip" data-start="0" data-duration="15" data-track-index="2"><span id="hud-label-in">f(t) &rarr; pixels</span></div>
      <div id="hud-res" class="hud clip" data-start="0" data-duration="15" data-track-index="3"><span id="hud-res-in">1920 &times; 1080 &middot; 30 fps</span></div>
      <div id="hud-t" class="hud clip" data-start="0" data-duration="15" data-track-index="4"><span id="hud-t-in">t = <b id="tval">0.000</b> s</span></div>
      <div id="hud-f" class="hud clip" data-start="0" data-duration="15" data-track-index="5"><span id="hud-f-in">frame <b id="fval">001</b> / 450</span></div>

      <div id="act1" class="clip" data-start="2.0" data-duration="4.6" data-track-index="1" data-layout-allow-overlap>
        <div class="line" id="l1"><span id="w1a">Write</span> <span id="w1b">HTML.</span></div>
        <div class="line" id="l2"><span id="w2a">Seek</span> <span id="w2b">time.</span></div>
        <div class="line" id="l3"><span id="w3a">Render</span> <span id="w3b" class="acc">film.</span></div>
      </div>

      <div id="c1" class="cut clip" data-start="7.0" data-duration="0.5" data-track-index="1"><span id="c1s">HTML</span></div>
      <div id="c2" class="cut clip" data-start="7.5" data-duration="0.5" data-track-index="1"><span id="c2s">CSS</span></div>
      <div id="c3" class="cut clip" data-start="8.0" data-duration="0.5" data-track-index="1"><span id="c3s">GSAP</span></div>
      <div id="c4" class="cut clip" data-start="8.5" data-duration="0.5" data-track-index="1"><span id="c4s">WebGL</span></div>
      <div id="c5" class="cut clip" data-start="9.0" data-duration="0.5" data-track-index="1"><span id="c5s">Shaders</span></div>
      <div id="c6" class="cut clip" data-start="9.5" data-duration="0.5" data-track-index="1"><span id="c6s">Audio</span></div>
      <div id="c7" class="cut small clip" data-start="10.0" data-duration="0.5" data-track-index="1"><span id="c7s">Deterministic.</span></div>

      <div id="title-wrap" class="clip" data-start="10.9" data-duration="4.1" data-track-index="1">
        <div id="title"><span id="tf">f</span><span id="tp1" class="paren">(</span><span id="tt">t</span><span id="tp2" class="paren">)</span></div>
        <div id="sub"><span id="s1">Fifteen seconds.</span>&nbsp;<span id="s2">450 frames.</span>&nbsp;<span id="s3" class="em">One function of time.</span></div>
      </div>

      <div id="flash-clip" class="clip" data-start="0" data-duration="15" data-track-index="6" data-layout-ignore style="position:absolute;inset:0;z-index:6;pointer-events:none">
        <div id="flash" style="opacity:0"></div>
      </div>

      <audio id="score" class="clip" src="assets/score.wav" data-start="0" data-duration="15" data-track-index="7" data-volume="1"></audio>
    </div>

    <script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;
out vec4 outColor;

#define PI 3.14159265

float hash(vec2 p){ uvec2 q = uvec2(ivec2(floor(p))) * uvec2(1597334673u, 3812015801u); uint n = (q.x ^ q.y) * 1597334673u; n ^= n >> 16; n *= 2246822519u; n ^= n >> 13; return float(n) * (1.0/4294967295.0); }
float sat(float x){ return clamp(x, 0.0, 1.0); }
float ease3(float x){ x = sat(x); return x*x*(3.0-2.0*x); }
float easeIn(float x){ x = sat(x); return x*x*x; }
float easeOut(float x){ x = 1.0 - sat(x); return 1.0 - x*x*x*x; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 pal(float t){ return 0.5 + 0.5*cos(2.0*PI*(t + vec3(0.0, 0.33, 0.67))); }
// critically damped-ish spring from 0 to 1 with mild overshoot (damping ~0.55)
float spring(float x){ if (x <= 0.0) return 0.0; return 1.0 - exp(-6.0*x)*cos(9.0*x); }

float gyroid(vec3 p){ return dot(sin(p), cos(p.yzx)); }

// ---------- Act 0 / 3: oscilloscope trace -------------------------------------
vec3 scope(vec2 uv, float t, float amp, float reveal, float width, float bright, float hue){
  float x = uv.x;
  float y = 0.0;
  y += 0.20*sin(x*7.0 + t*5.0);
  y += 0.07*sin(x*17.0 - t*9.0);
  y += 0.035*sin(x*31.0 + t*13.0);
  float env = exp(-x*x*1.4);
  y *= amp*env;
  float d = abs(uv.y - y);
  float m = smoothstep(reveal + 0.02, reveal - 0.02, x);   // drawn left -> right
  float core = exp(-d*d/(width*width)) * 1.4;
  float glow = 0.018/(d + 0.012) * 0.6;
  vec3 c = mix(vec3(1.0, 0.55, 0.25), vec3(0.45, 0.85, 1.0), 0.5 + 0.5*sin(clamp(x, -2.0, 2.0)*2.0 + hue));
  // bright writing head
  vec2 head = vec2(reveal, 0.0); head.y = y; float hd = length(uv - vec2(reveal, (0.20*sin(reveal*7.0 + t*5.0) + 0.07*sin(reveal*17.0 - t*9.0) + 0.035*sin(reveal*31.0 + t*13.0))*amp*exp(-reveal*reveal*1.4)));
  vec3 headc = vec3(1.0, 0.9, 0.8) * (0.004/(hd*hd + 0.0006)) * 0.08 * step(-1.9, reveal) * step(reveal, 1.9);
  return (c*(core + glow)*m + headc) * bright;
}

// ---------- Act 1: the object --------------------------------------------------
float gScale, gGrow, gMorph;
float mapObj(vec3 p){
  float r = 1.05*gGrow;
  vec3 q = p;
  q.xz *= rot(uT*0.35);
  q.xy *= rot(uT*0.21);
  float g = gyroid(q*3.2 + vec3(0.0, uT*0.9, 0.0));
  float d = length(p) - r;
  d += 0.11*g*gGrow*gMorph;
  d += 0.05*sin(5.0*q.x + uT*2.0)*sin(5.0*q.y - uT*1.7)*sin(5.0*q.z)*gGrow;
  return d*0.6;
}
vec3 nObj(vec3 p){
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(mapObj(p+e.xyy)-mapObj(p-e.xyy), mapObj(p+e.yxy)-mapObj(p-e.yxy), mapObj(p+e.yyx)-mapObj(p-e.yyx)));
}
vec3 env(vec3 rd, float turn){
  rd.xz *= rot(turn);
  // dark studio with two soft strips: warm key, cool rim
  float s1 = smoothstep(0.25, 0.0, abs(rd.y - 0.55)) * smoothstep(-0.2, 0.6, rd.x);
  float s2 = smoothstep(0.18, 0.0, abs(rd.x + 0.7)) * smoothstep(-0.6, 0.4, rd.y);
  float s3 = smoothstep(0.1, 0.0, abs(rd.y + 0.15)) * 0.25;
  return vec3(1.0, 0.72, 0.45)*s1*2.2 + vec3(0.4, 0.75, 1.0)*s2*1.8 + vec3(0.6, 0.5, 0.9)*s3 + vec3(0.015, 0.02, 0.035);
}
vec3 stars(vec2 uv){
  vec2 g = floor(uv*90.0); vec2 f = fract(uv*90.0) - 0.5;
  float h = hash(g);
  float s = step(0.985, h) * exp(-dot(f, f)*60.0) * (0.4 + 0.6*hash(g + 7.0));
  return vec3(s)*vec3(0.8, 0.9, 1.0);
}
vec3 actObject(vec2 uv, float lt){
  // lt: seconds since 2.0
  gGrow = spring(lt*0.9);
  gMorph = 0.6 + 0.4*sin(lt*0.8);
  // camera: slow orbit, object sits right of centre, then dives in (4.3 .. 5.0)
  float dive = easeIn((lt - 4.2)/0.8);
  float ang = 0.6 + lt*0.28;
  float dist = mix(3.4, 0.05, dive);
  vec3 ro = vec3(sin(ang)*dist, 0.35*(1.0-dive) + 0.15*sin(lt*0.5), cos(ang)*dist);
  vec3 ta = vec3(0.0);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec2 suv = uv - vec2(0.48*(1.0 - dive)*easeOut(lt/1.4), 0.0);
  vec3 rd = normalize(suv.x*uu + suv.y*vv + (1.6 - 0.6*dive)*ww);

  vec3 bg = vec3(0.012, 0.014, 0.03) + 0.05*vec3(0.25, 0.3, 0.6)*exp(-length(suv)*1.6) + stars(uv + vec2(lt*0.01, 0.0))*0.6;
  float t = 0.0; float hit = -1.0; float glow = 0.0;
  for (int i = 0; i < 72; i++){
    vec3 p = ro + rd*t;
    float d = mapObj(p);
    glow += 0.012/(0.02 + abs(d));
    if (d < 0.0015){ hit = t; break; }
    t += d;
    if (t > 8.0) break;
  }
  vec3 col = bg;
  float turn = lt*0.6;
  if (hit > 0.0){
    vec3 p = ro + rd*hit;
    vec3 n = nObj(p);
    vec3 r = reflect(rd, n);
    float fr = pow(1.0 - sat(dot(n, -rd)), 3.0);
    float g = gyroid(p*3.2 + vec3(0.0, uT*0.9, 0.0));
    vec3 irid = pal(0.55 + 0.35*fr + 0.25*g + 0.05*lt);
    vec3 base = mix(vec3(0.03), irid*0.55, 0.65);
    vec3 key = vec3(1.0, 0.75, 0.5) * sat(dot(n, normalize(vec3(0.8, 0.7, 0.4))));
    vec3 rim = vec3(0.4, 0.8, 1.0) * pow(sat(1.0 - dot(n, -rd)), 4.0) * 1.6;
    col = base*(0.25 + 0.9*key) + env(r, turn)*(0.18 + 0.9*fr)*mix(vec3(1.0), irid, 0.5) + rim;
    // cavities glow: gyroid seams emit
    col += vec3(1.0, 0.45, 0.15) * smoothstep(0.25, 0.0, abs(g)) * 0.35 * gGrow;
  }
  col += vec3(0.35, 0.55, 1.0) * glow * 0.0035 * gGrow;
  // birth flash at lt=0 from the gathered point
  col += vec3(1.0, 0.85, 0.7) * exp(-lt*5.0) * 0.06/(dot(uv - vec2(0.0), uv) + 0.01);
  // as the camera crosses the surface the frame floods warm
  col = mix(col, vec3(4.0, 2.4, 1.4), smoothstep(0.45, 0.68, dive));
  return col;
}

// ---------- Act 2: inside — gyroid tunnel ---------------------------------------
float mapTun(vec3 p){
  float g = gyroid(p*1.6) / 1.6;
  float d = abs(g) - 0.06;
  // keep a clear flight path along z
  d = max(d, 0.55 - length(p.xy - vec2(0.35*sin(p.z*0.35), 0.35*cos(p.z*0.27))));
  return d;
}
vec3 actTunnel(vec2 uv, float lt){
  // lt: seconds since 7.0, 3.5 s; speed rises towards the white-out
  float z = lt*3.2 + lt*lt*lt*0.55;
  vec3 ro = vec3(0.35*sin(z*0.35), 0.35*cos(z*0.27), z);
  vec3 ah = vec3(0.35*sin((z+1.0)*0.35), 0.35*cos((z+1.0)*0.27), z+1.0);
  vec3 ww = normalize(ah - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec2 ruv = uv * rot(lt*0.35 + 0.08*lt*lt);
  float fov = 1.25 - 0.35*easeIn(lt/3.5);
  vec3 rd = normalize(ruv.x*uu + ruv.y*vv + fov*ww);
  float t = 0.0; float acc = 0.0; float hit = -1.0;
  for (int i = 0; i < 80; i++){
    vec3 p = ro + rd*t;
    float d = mapTun(p);
    acc += exp(-abs(d)*30.0) * 0.03;
    if (d < 0.002){ hit = t; break; }
    t += d*0.8;
    if (t > 14.0) break;
  }
  vec3 fogc = mix(vec3(0.01, 0.015, 0.05), vec3(0.12, 0.03, 0.05), 0.5 + 0.5*sin(lt*0.9));
  vec3 col = fogc;
  if (hit > 0.0){
    vec3 p = ro + rd*hit;
    vec2 e = vec2(0.003, 0.0);
    vec3 n = normalize(vec3(mapTun(p+e.xyy)-mapTun(p-e.xyy), mapTun(p+e.yxy)-mapTun(p-e.yxy), mapTun(p+e.yyx)-mapTun(p-e.yyx)));
    float fr = pow(1.0 - sat(dot(n, -rd)), 2.0);
    vec3 irid = pal(0.08*p.z + 0.3*fr + 0.6);
    float lines = smoothstep(0.92, 1.0, sin(p.z*6.0 - lt*14.0)*0.5 + 0.5);
    col = irid*(0.15 + 0.85*sat(dot(n, -rd))) + vec3(1.0, 0.6, 0.3)*fr*0.8 + irid*lines*2.5;
    float fog = 1.0 - exp(-hit*0.3);
    col = mix(col, fogc, fog);
  }
  col += acc*vec3(0.6, 0.8, 1.0)*0.35;
  // centre light at the end of the tunnel
  col += vec3(1.0, 0.8, 0.6) * 0.012/(dot(uv, uv) + 0.012) * (0.3 + easeIn(lt/3.5)*3.0);
  // entry: warm flood fading away (matches act 1 exit)
  col = mix(col, vec3(4.0, 2.4, 1.4), 1.0 - easeOut(lt/0.32));
  return col;
}

// ---------- Act 3: calm — the trace returns under the title ----------------------
vec3 actFinal(vec2 uv, float lt){
  vec3 bg = vec3(0.012, 0.013, 0.025) + 0.06*vec3(0.3, 0.35, 0.7)*exp(-length(uv - vec2(0.0, 0.05))*1.3);
  bg += stars(uv*0.7 + vec2(lt*0.004, 0.0))*0.4;
  float amp = 0.5*exp(-lt*0.9) + 0.06;
  vec3 tr = scope(uv - vec2(0.0, -0.33), uT, amp, mix(-1.9, 1.9, easeOut(lt/1.6)), 0.003, 0.55, 2.0);
  bg += vec3(5.0, 4.2, 3.4) * exp(-lt*7.0);
  bg += vec3(1.0, 0.6, 0.3) * 0.05 * exp(-length((uv - vec2(0.0, 0.17))*vec2(0.8, 1.6))*3.0) * easeOut(lt/1.5);
  return bg + tr;
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = (frag - 0.5*uRes) / uRes.y;
  float T = uT;
  vec3 col;
  if (T < 2.0){
    float reveal = mix(-1.9, 1.9, easeOut(T/1.25)) + step(1.3, T)*100.0;
    float gather = ease3((T - 1.35)/0.65);          // collapse to a point before 2.0
    vec2 suv = vec2(uv.x/(1.0 - 0.985*gather + 1e-3), uv.y);
    float amp = mix(1.0, 0.0, gather);
    col = vec3(0.01, 0.012, 0.022) + scope(suv, T, amp, reveal, 0.004, 1.0 + 3.0*gather, 0.0) * exp(-uv.x*uv.x*gather*gather*30.0);
    col += vec3(1.0, 0.85, 0.7) * gather*gather * 0.02/(dot(uv, uv) + 0.002);
  } else if (T < 7.0){
    col = actObject(uv, T - 2.0);
  } else if (T < 10.5){
    col = actTunnel(uv, T - 7.0);
  } else {
    col = actFinal(uv, T - 10.5);
  }
  // grade: filmic tonemap, vignette, grain (seeded by frame)
  col = 1.0 - exp(-max(col, 0.0)*1.3);
  float vig = 1.0 - 0.45*pow(length(uv*vec2(0.85, 1.0)), 2.2);
  col *= vig;
  float fr = floor(T*30.0);
  col += (hash(frag + fr*13.1) - 0.5) * 0.035;
  outColor = vec4(col, 1.0);
}
</script>

    <script>
      // ---- WebGL world, drawn as a pure function of t ---------------------------
      const canvas = document.getElementById("world");
      const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
      const vsrc = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
      function sh(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vsrc));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uRes = gl.getUniformLocation(prog, "uRes");
      const uT = gl.getUniformLocation(prog, "uT");
      gl.viewport(0, 0, canvas.width, canvas.height);

      const tval = document.getElementById("tval");
      const fval = document.getElementById("fval");
      function renderAt(t) {
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uT, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.finish();
        tval.textContent = t.toFixed(3).padStart(6, "0");
        fval.textContent = String(Math.min(450, Math.floor(t * 30 + 1e-6) + 1)).padStart(3, "0");
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);

      // ---- Typography timeline --------------------------------------------------
      const tl = gsap.timeline({ paused: true });
      const blurIn = (sel, at, d = 0.16) =>
        tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, at);

      // HUD fades in with the trace, dims during the montage, returns for the title
      tl.fromTo(["#hud-label-in", "#hud-res-in", "#hud-t-in", "#hud-f-in"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08, ease: "power2.out" }, 0.15);
      const hudAll = ["#hud-label-in", "#hud-res-in", "#hud-t-in", "#hud-f-in"];
      tl.to(hudAll, { opacity: 0, duration: 0.2 }, 6.5);
      tl.to(hudAll, { opacity: 1, duration: 0.4 }, 11.4);

      // Act 1: three lines, one per beat (words 0.1 s apart), on the beat hits
      blurIn("#w1a", 2.30); blurIn("#w1b", 2.40);
      blurIn("#w2a", 3.30); blurIn("#w2b", 3.40);
      blurIn("#w3a", 4.30);
      tl.fromTo("#w3b", { opacity: 0, filter: "blur(14px)", scale: 1.25, transformOrigin: "0% 60%" },
        { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.45, ease: "expo.out" }, 4.40);
      // exit as the camera dives: blur + drift left, word by word
      tl.to(["#w1a", "#w1b", "#w2a", "#w2b", "#w3a", "#w3b"],
        { opacity: 0, filter: "blur(12px)", x: -60, duration: 0.22, stagger: 0.04, ease: "power3.in" }, 6.05);

      // Act 2: hard cuts on the beat; each word lands slightly large and settles
      ["#c1s", "#c2s", "#c3s", "#c4s", "#c5s", "#c6s", "#c7s"].forEach((id, i) => {
        const at = 7.0 + i * 0.5;
        tl.fromTo(id, { scale: 1.18, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, at);
      });

      // White-out at 10.5 from the tunnel's light
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power3.in" }, 10.32);
      tl.to("#flash", { opacity: 0, duration: 0.1, ease: "none" }, 10.5);

      // Act 3: title per letter, then the subtitle per phrase
      ["#tf", "#tp1", "#tt", "#tp2"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0.0, filter: "blur(16px)", y: 30 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "expo.out" }, 11.1 + i * 0.1);
      });
      blurIn("#s1", 12.40, 0.2); blurIn("#s2", 12.62, 0.2); blurIn("#s3", 12.84, 0.25);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
