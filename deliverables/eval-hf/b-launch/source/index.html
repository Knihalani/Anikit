<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"cta","type":"string","label":"Call to action","default":"POST /v1/transfers"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #e7e9e4;
        --ink: #121311;
        --signal: #ff4f1a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.4" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="call" data-composition-id="call" data-composition-src="compositions/call.html"
        data-start="2.4" data-duration="3.6" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="track" data-composition-id="track" data-composition-src="compositions/track.html"
        data-start="6" data-duration="5.6" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="11.6" data-duration="3.4" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index:4"></div>

      <!-- music lane: rail-clack bed built from the bundled samples (assets/bed.wav, tools/bed.py) -->
      <audio id="bed" class="clip" src="assets/bed.wav" data-start="2.2" data-duration="12.8" data-track-index="1" data-volume="0.33"></audio>
      <audio id="riser" class="clip" src="assets/sfx/riser.mp3" data-start="8.73" data-duration="3.7" data-track-index="2" data-volume="0.39"></audio>

      <!-- effects -->
      <audio id="sfx-roll1" class="clip" src="assets/sfx/click-soft.mp3" data-start="0.38" data-duration="0.36" data-track-index="3" data-volume="0.50"></audio>
      <audio id="sfx-roll2" class="clip" src="assets/sfx/key-press.mp3" data-start="0.73" data-duration="0.36" data-track-index="3" data-volume="0.44"></audio>
      <audio id="sfx-roll3" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.08" data-duration="0.36" data-track-index="3" data-volume="0.50"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.5" data-media-start="0.6" data-duration="2.8" data-track-index="4" data-volume="0.44"></audio>
      <audio id="sfx-morph" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.86" data-duration="0.5" data-track-index="3" data-volume="0.33"></audio>
      <audio id="sfx-type" class="clip" src="assets/sfx/typing.mp3" data-start="4.0" data-duration="1.5" data-track-index="3" data-volume="0.39"></audio>
      <audio id="sfx-enter" class="clip" src="assets/sfx/key-press.mp3" data-start="5.27" data-duration="0.4" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-resp" class="clip" src="assets/sfx/pop.mp3" data-start="5.32" data-duration="0.6" data-track-index="3" data-volume="0.33"></audio>
      <audio id="sfx-carry" class="clip" src="assets/sfx/whoosh.mp3" data-start="5.62" data-duration="0.55" data-track-index="5" data-volume="0.39"></audio>
      <audio id="sfx-hook1" class="clip" src="assets/sfx/pop.mp3" data-start="7.07" data-duration="0.6" data-track-index="3" data-volume="0.44"></audio>
      <audio id="sfx-hook2" class="clip" src="assets/sfx/click.mp3" data-start="7.37" data-duration="0.36" data-track-index="5" data-volume="0.44"></audio>
      <audio id="sfx-hook3" class="clip" src="assets/sfx/pop.mp3" data-start="7.57" data-duration="0.6" data-track-index="3" data-volume="0.55"></audio>
      <audio id="sfx-grow" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.96" data-duration="0.5" data-track-index="3" data-volume="0.44"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="12.17" data-duration="2.1" data-track-index="5" data-volume="0.55"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
