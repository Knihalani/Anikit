  <script>
    const tl = gsap.timeline({ paused: true });
    // the yard builds around the token
    tl.fromTo("#trk-rails", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0);
    tl.fromTo("#trk-stn-a, #trk-stn-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", stagger: 0.1 }, 0.3);
    ["1", "2", "3"].forEach((n, i) => {
      tl.fromTo("#trk-p" + n, { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "expo.out" }, 0.28 + i * 0.07);
      tl.fromTo("#trk-l" + n, { scale: 0 }, { scale: 1, duration: 0.26, ease: "expo.out" }, 0.36 + i * 0.07);
    });

    // one run, one ease: x 0 -> 1250 between 0.9 s and 2.0 s
    const T0 = 0.9, TD = 1.1, DX = 1250;
    tl.fromTo("#trk-token", { x: 0 }, { x: DX, duration: TD, ease: "power2.inOut" }, T0);
    // time the token's centre (200 + 150 + x) crosses each signal: invert power2.inOut
    const cross = (sigX) => {
      const p = (sigX - 350) / DX;
      const u = p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2);
      return T0 + u * TD;
    };
    [[1, 520], [2, 960], [3, 1400]].forEach(([n, x]) => {
      const tc = cross(x);
      tl.fromTo("#trk-l" + n, { backgroundColor: "#e7e9e4" }, { backgroundColor: "#ff4f1a", duration: 0.05 }, tc);
      tl.fromTo("#trk-c" + n, { opacity: 0, scale: 0.86, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, tc);
    });

    // balances move as the money lands
    const bal = { a: 12800, b: 3150 };
    const fmt = (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const balA = document.querySelector("#trk-bal-a");
    const balB = document.querySelector("#trk-bal-b");
    tl.fromTo(bal, { a: 12800, b: 3150 }, {
      a: 10400, b: 5550, duration: 0.45, ease: "power3.out",
      onUpdate: () => { balA.textContent = fmt(Math.round(bal.a)); balB.textContent = fmt(Math.round(bal.b)); },
    }, 1.98);
    tl.fromTo("#trk-bal-b", { color: "#121311" }, { color: "#ff4f1a", duration: 0.1 }, 1.98);

    // object becomes the world: the token swells past the frame
