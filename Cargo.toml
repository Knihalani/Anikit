[workspace]
resolver = "2"
members = ["crates/anikit-core", "crates/anikit-wasm", "crates/anikit-py", "crates/anikit-node", "crates/anikit-video", "crates/ak264", "crates/anikit-shader"]
default-members = ["crates/anikit-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/knihalani/anikit"

# `cargo build --release`: fast to build from source (thin LTO, parallel codegen).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

# Published binaries (`.github/workflows/video-release.yml`): built once in CI, so
# take every cross-crate optimisation.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Profile used for the WebAssembly build: abort on panic (no unwinding tables),
# maximum optimisation, everything inlined across crates.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
