<!doctype html><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#eceae6}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import { scene, plane, ready } from '../../../packages/anikit/dist/anikit.js';
import { buildHeadphones } from '../geometry.js';
await ready;
const s = scene('#c', { camera: { fov: 30, position: [30, 14, 52], target: [0, -0.6, 0] }, environment: 'studio', shadows: true, bloom: true, background: '#eceae6' });
s.add(plane(400, 400), { material: { color: '#e9e6e1', roughness: 0.9 }, position: [0, -8.75, 0] });
const MAT = { chrome: 'chrome', brushed: { preset: 'chrome', roughness: 0.3, color: '#e6e7ea' }, brushedMist: { preset: 'chrome', roughness: 0.32, color: '#a9bcd6' }, glass: 'glass', rubberSand: { preset: 'rubber', color: '#e4dbcf' } };
for (const p of buildHeadphones(1)) {
  const m = p.mesh, n = m.nv;
  const g = { positions: new Float32Array(n * 3), normals: new Float32Array(n * 3), uvs: new Float32Array(n * 2), indices: m.i.slice(0, m.ni) };
  for (let k = 0; k < n; k++) for (let q = 0; q < 3; q++) { g.positions[k * 3 + q] = m.v[k * 10 + q]; g.normals[k * 3 + q] = m.v[k * 10 + 3 + q]; }
  s.add(g, { material: MAT[p.mat] });
}
window.s = s;
</script>
