<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mountain test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb8dc; font: 13px/1.4 ui-monospace, monospace; }
  #mountain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: grid; grid-template-columns: auto 1fr 4em; gap: 6px 12px; align-items: center; color: #222; background: rgba(255,255,255,0.72); padding: 8px 12px; border-radius: 10px; }
  .ui input[type=range] { width: 100%; }
</style>
</head>
<body>
<canvas id="mountain"></canvas>
<div class="ui">
  <label>p</label><input id="p" type="range" min="0" max="1" step="0.001" value="0" /><span id="pv">0.000</span>
  <label>push</label><input id="push" type="range" min="0" max="1" step="0.001" value="0" /><span id="pushv">0.000</span>
  <span></span><span id="ms"></span><span></span>
</div>
<script type="module">
import { createMountain } from './mountain.js';
const canvas = document.getElementById('mountain');
const m = createMountain(canvas);
const resize = () => m.resize(innerWidth, innerHeight, Math.min(2, devicePixelRatio));
resize(); addEventListener('resize', resize);
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.has('p')) $('p').value = q.get('p');
if (q.has('push')) $('push').value = q.get('push');
if (q.has('noui')) document.querySelector('.ui').style.display = 'none';
const look = { x: 0, y: 0 }, target = { x: 0, y: 0 };
addEventListener('pointermove', (e) => { target.x = (e.clientX / innerWidth) * 2 - 1; target.y = 1 - (e.clientY / innerHeight) * 2; });
let last = performance.now(), avg = 0;
window.__mountain = { frames: 0, look: target };
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  look.x += (target.x - look.x) * Math.min(1, dt * 4); look.y += (target.y - look.y) * Math.min(1, dt * 4);
  const p = +$('p').value, push = +$('push').value;
  $('pv').textContent = p.toFixed(3); $('pushv').textContent = push.toFixed(3);
  const t0 = performance.now();
  m.frame(now / 1000, dt, p, look, push);
  avg = avg * 0.95 + (performance.now() - t0) * 0.05;
  $('ms').textContent = avg.toFixed(2) + ' ms cpu';
  window.__mountain.frames++;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
