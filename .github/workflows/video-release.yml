name: Video release
# Prebuilt `anikit-video` binaries, so nobody has to compile before their first render.
# Every push to the main branch republishes the rolling release `video-latest`;
# install with:  curl -fsSL https://raw.githubusercontent.com/knihalani/anikit/claude/epic-ramanujan-qe7x4w/install.sh | sh
on:
  push:
    branches: [claude/epic-ramanujan-qe7x4w]
    paths: ['crates/anikit-video/**', 'crates/anikit-core/**', 'crates/anikit-shader/**', 'crates/ak264/**', 'Cargo.lock', 'Cargo.toml', '.github/workflows/video-release.yml', 'install.sh', 'install.ps1']
  workflow_dispatch:

permissions:
  contents: write

# Queue, never cancel: main gets merges often, and a cancelled run publishes nothing.
concurrency:
  group: video-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          # Intel macOS runners are scarce: cross-compile on Apple silicon (smoke-tested under Rosetta when present).
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: video-${{ matrix.target }}
      # `dist`: fat LTO, one codegen unit (slow to build, fastest to run). Built once here.
      - run: cargo build --profile dist -p anikit-video --bin anikit-video --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          bin=target/${{ matrix.target }}/dist/anikit-video
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin.exe" out/anikit-video.exe
            (cd out && 7z a ../anikit-video-${{ matrix.name }}.zip anikit-video.exe >/dev/null)
          else
            cp "$bin" out/anikit-video
            tar -C out -czf anikit-video-${{ matrix.name }}.tar.gz anikit-video
          fi
          ls -la anikit-video-*
      - name: Smoke test
        shell: bash
        run: |
          b=out/anikit-video; [ -f out/anikit-video.exe ] && b=out/anikit-video.exe
          if ! "$b" --version >/dev/null 2>&1 && ! "$b" schema >/dev/null 2>&1; then echo "can't run this target here; skipped"; exit 0; fi
          echo '{ "size": [320, 180], "scenes": [ "Hello | from CI" ] }' > s.json
          "$b" check s.json --json
          "$b" still s.json --at 1 -o s.png
          test -s s.png
      - uses: actions/upload-artifact@v4
        with:
          name: anikit-video-${{ matrix.name }}
          path: anikit-video-${{ matrix.name }}.*

  publish:
    needs: build
    # Publish whatever built: a platform whose runner never came (macOS jobs are sometimes
    # cancelled for lack of runners) is simply missing this time.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the rolling release `video-latest`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls dist/anikit-video-* >/dev/null 2>&1 || { echo "nothing built"; exit 1; }
          cd dist && sha256sum anikit-video-* > SHA256SUMS && cd ..
          git tag -f video-latest "$GITHUB_SHA"
          git push -f origin refs/tags/video-latest
          notes="Prebuilt anikit-video binaries from ${GITHUB_SHA::7}. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | sh"
          if gh release view video-latest >/dev/null 2>&1; then
            gh release edit video-latest --title "Anikit Video (latest)" --notes "$notes"
          else
            gh release create video-latest --title "Anikit Video (latest)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload video-latest dist/* --clobber
