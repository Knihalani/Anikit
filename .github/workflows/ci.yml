name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test -p anikit-core
      - run: cargo clippy -p anikit-core -p anikit-wasm -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/anikit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: node scripts/build.mjs

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/anikit-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv && . .venv/bin/activate && pip install maturin pytest && maturin develop --release && pytest
