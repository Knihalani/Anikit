<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<script src="assets/gsap.min.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#05040b}.d{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;will-change:transform}</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<script>
  // 5,000 DOM dots on the same orbits as floor/scale/dots5000.json, positioned every frame from the timeline time.
  const N = 5000, root = document.getElementById("root"), els = [];
  for (let i = 0; i < N; i++) { const d = document.createElement("div"); d.className = "d"; d.style.background = Math.floor(i / 1000) % 2 ? "#7c5cff" : "#ff5ca8"; root.appendChild(d); els.push(d); }
  const clock = { t: 0 };
  const draw = () => { const t = clock.t; for (let i = 0; i < N; i++) { const r = 120 + 11 * Math.sqrt(i), a = i * 2.39996 + t * (0.4 + 0.2 * Math.sin(i));
    els[i].style.transform = `translate(${955 + r * Math.cos(a)}px, ${535 + r * 0.55 * Math.sin(a)}px)`; } };
  const tl = gsap.timeline({ paused: true }); tl.to(clock, { t: 5, duration: 5, ease: "none", onUpdate: draw }, 0); draw();
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script></body></html>
