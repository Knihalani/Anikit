[package]
name = "anikit-py"
description = "Python bindings for anikit-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_anikit"
crate-type = ["cdylib"]

[dependencies]
anikit-core = { path = "../anikit-core", features = ["std"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
