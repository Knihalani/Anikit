[package]
name = "anikit-video"
description = "Anikit Video: programmatic video for agents. A JSON spec in, an MP4 out, rendered natively (no browser)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "anikit-video"
path = "src/bin/anikit-video.rs"

[dependencies]
anikit-core = { path = "../anikit-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
kurbo = "0.13"
schemars = "1"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
serde_norway = "0.9.42"
taffy = { version = "0.15.1", features = ["parse"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
vello_cpu = "0.4"
parley = "0.13.0"
skrifa = "0.49"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac", "aac", "isomp4"] }

[dev-dependencies]
png = "0.18.1"
