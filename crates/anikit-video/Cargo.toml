[package]
name = "anikit-video"
description = "Anikit Video: programmatic video for agents. A JSON spec in, an MP4 out, rendered natively (no browser)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "anikit-video"
path = "src/bin/anikit-video.rs"

[dependencies]
anikit-core = { path = "../anikit-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
kurbo = "0.13"
schemars = "1"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
serde_norway = "0.9.42"
taffy = "0.15.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
