[package]
name = "anikit-video"
description = "Anikit Video: programmatic video for agents. A JSON spec in, an MP4 out, rendered natively (no browser)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "anikit-video"
path = "src/bin/anikit-video.rs"

[dependencies]
anikit-core = { path = "../anikit-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
kurbo = "0.13"
