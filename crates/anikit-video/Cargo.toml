[package]
name = "anikit-video"
description = "Anikit Video: programmatic video for agents. A JSON spec in, an MP4 out, rendered natively (no browser)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "anikit-video"
path = "src/bin/anikit-video.rs"

[dependencies]
anikit-core = { path = "../anikit-core", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
kurbo = "0.13"
parley = "0.13.0"
vello_cpu = "0.4.0"
taffy = { version = "0.15.1", features = ["parse"] }
skrifa = "0.49"
two-face = { version = "0.5.2", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing"] }

[dev-dependencies]
vello_cpu = "0.4.0"

[features]
default = ["onig"]
# Code highlighting regex engine: Oniguruma (fast, C) or fancy-regex (pure Rust, e.g. for wasm).
onig = ["syntect/regex-onig", "two-face/syntect-onig"]
fancy-regex = ["syntect/regex-fancy", "two-face/syntect-fancy"]
