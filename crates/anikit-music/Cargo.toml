[package]
name = "anikit-music"
description = "Anikit Music: a fast, deterministic music engine (samplers, physical models, synths, composition, mixing and mastering) for programmatic video."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "flac", "wav", "pcm"] }
midly = "0.5"
rustfft = "6"

[dev-dependencies]
